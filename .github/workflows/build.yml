name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build
        run: |
          unzip -o igcleaner-project.zip -d proj
          ls -R proj | head -40
          S=$(find proj -name settings.gradle | head -1)
          if [ -z "$S" ]; then echo "settings.gradle NOT FOUND"; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: InstaCleaner-APK
          path: proj/**/build/outputs/apk/debug/*.apk
