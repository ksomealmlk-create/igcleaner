name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build
        run: |
          ROOT=$PWD
          unzip -o igcleaner-project-1.zip -d proj
          S=$(find proj -name settings.gradle | head -1)
          if [ -z "$S" ]; then echo "settings.gradle NOT FOUND"; exit 1; fi
          D=$(dirname "$S")
          if [ -d "$ROOT/overrides" ]; then cp -r "$ROOT/overrides/." "$D/"; fi
          cd "$D"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: InstaCleaner-APK
          path: proj/**/build/outputs/apk/debug/*.apk
